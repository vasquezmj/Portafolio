<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Biblioteca Pública">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14283D"/>
      <stop offset="100%" stop-color="#234567"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B89138"/>
      <stop offset="50%" stop-color="#DFBE6A"/>
      <stop offset="100%" stop-color="#B89138"/>
    </linearGradient>
  </defs>
  <!-- Fondo azul marino institucional -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Sombra de cubierta del libro -->
  <path d="M11 19 C18 16, 26 17, 32 21 C38 17, 46 16, 53 19 L53 48 C46 45, 38 46, 32 50 C26 46, 18 45, 11 48 Z"
        fill="#B89138"/>

  <!-- Páginas abiertas en tono pergamino -->
  <path d="M13 16 C19.5 13.5, 26.5 14.5, 32 18.5 L32 46.5 C26.5 42.5, 19.5 41.5, 13 44 Z"
        fill="#F7F5F0"/>
  <path d="M51 16 C44.5 13.5, 37.5 14.5, 32 18.5 L32 46.5 C37.5 42.5, 44.5 41.5, 51 44 Z"
        fill="#EDE8DC"/>

  <!-- Líneas de texto editorial -->
  <path d="M17 23 Q23 22 28 24 M17 29 Q23 28 28 30 M17 35 Q23 34 28 36"
        stroke="#14283D" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.55"/>
  <path d="M36 24 Q41 22 47 23 M36 30 Q41 28 47 29 M36 36 Q41 34 47 35"
        stroke="#14283D" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.55"/>

  <!-- Lomo central y separador dorado -->
  <line x1="32" y1="18" x2="32" y2="48" stroke="#14283D" stroke-width="2" stroke-linecap="round"/>
  <path d="M29.5 17.5 L34.5 17.5 L34.5 34 L32 31.5 L29.5 34 Z" fill="url(#goldGrad)"/>
</svg>
