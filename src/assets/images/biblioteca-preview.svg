    <text x="15" y="100" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="8">Novela Contemp.</text>
    <text x="10" y="118" fill="#14283D" font-family="Georgia, serif" font-size="11" font-weight="bold">Cien años de soledad</text>
