    <text x="10" y="118" fill="#14283D" font-family="Georgia, serif" font-size="11" font-weight="bold">Cosmos</text>
    <text x="10" y="131" fill="#5A6570" font-family="system-ui, sans-serif" font-size="9">Carl Sagan</text>
    <rect x="10" y="138" width="52" height="14" rx="3" fill="#E6F4EA" />
    <text x="16" y="148" fill="#1E6B43" font-family="system-ui, sans-serif" font-size="8" font-weight="bold">3 disp.</text>
    <rect x="108" y="136" width="56" height="16" rx="3" fill="#14283D" />
    <text x="118" y="147" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="8">Ver ficha</text>
  </g>

