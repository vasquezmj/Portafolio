    <rect x="10" y="10" width="154" height="72" rx="4" fill="#EAE5DA" />
    <rect x="64" y="16" width="46" height="60" rx="2" fill="#1E4D3B" stroke="#B89138" stroke-width="1.5" />
    <text x="70" y="42" fill="#D4B259" font-family="Georgia, serif" font-size="6">CERVANTES</text>
    <text x="69" y="53" fill="#FFFFFF" font-family="Georgia, serif" font-size="6.5" font-weight="bold">EL QUIJOTE</text>
    <rect x="10" y="90" width="88" height="14" rx="3" fill="#234567" />
    <text x="15" y="100" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="8">Literatura Clásica</text>
    <text x="10" y="118" fill="#14283D" font-family="Georgia, serif" font-size="11" font-weight="bold">Don Quijote de la M.</text>
    <text x="10" y="131" fill="#5A6570" font-family="system-ui, sans-serif" font-size="9">Miguel de Cervantes</text>
    <rect x="10" y="138" width="52" height="14" rx="3" fill="#E6F4EA" />
    <text x="16" y="148" fill="#1E6B43" font-family="system-ui, sans-serif" font-size="8" font-weight="bold">5 disp.</text>
    <rect x="108" y="136" width="56" height="16" rx="3" fill="#14283D" />
    <text x="118" y="147" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="8">Ver ficha</text>
