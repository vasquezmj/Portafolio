      <stop offset="0%" stop-color="#14283D" />
      <stop offset="100%" stop-color="#234567" />
    </linearGradient>
    <linearGradient id="goldStrip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B89138" />
      <stop offset="50%" stop-color="#D4B259" />
      <stop offset="100%" stop-color="#B89138" />
    </linearGradient>
  </defs>

  <!-- Parchment Background -->
  <rect width="800" height="450" fill="#F7F5F0" />

  <!-- Top Navbar (#14283D) -->
  <rect width="800" height="44" fill="#14283D" />
  <rect x="28" y="13" width="18" height="18" rx="3" fill="#B89138" />
  <text x="54" y="27" fill="#FFFFFF" font-family="Georgia, serif" font-size="15" font-weight="bold">Biblioteca Pública</text>
  <text x="215" y="26" fill="#EAE5DA" font-family="system-ui, sans-serif" font-size="11">Inicio</text>
  <text x="262" y="26" fill="#EAE5DA" font-family="system-ui, sans-serif" font-size="11">Catálogo</text>
  <text x="328" y="26" fill="#EAE5DA" font-family="system-ui, sans-serif" font-size="11">Mis préstamos</text>
  <text x="422" y="26" fill="#D4B259" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Gestión</text>
  <rect x="650" y="12" width="120" height="20" rx="4" fill="#234567" />
  <text x="662" y="25" fill="#F7F5F0" font-family="system-ui, sans-serif" font-size="10">ES · EN · FR · PT</text>

  <!-- Gold Strip (.franja-dorada) -->
  <rect y="44" width="800" height="4" fill="url(#goldStrip)" />

  <!-- Staff Subnav (.staff-subnav) -->
  <rect y="48" width="800" height="28" fill="#EAE5DA" />
  <text x="28" y="66" fill="#14283D" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">MÓDULO BIBLIOTECARIO:</text>
  <text x="172" y="66" fill="#234567" font-family="system-ui, sans-serif" font-size="10">Panel</text>
  <text x="218" y="66" fill="#234567" font-family="system-ui, sans-serif" font-size="10">Circulación y Préstamos</text>
  <text x="358" y="66" fill="#234567" font-family="system-ui, sans-serif" font-size="10">Inventario Libros</text>
  <text x="462" y="66" fill="#234567" font-family="system-ui, sans-serif" font-size="10">Consultas</text>

  <!-- Hero Section (.hero-biblioteca) -->
  <rect y="76" width="800" height="145" fill="url(#heroGrad)" />
  <rect y="218" width="800" height="3" fill="#B89138" />

  <rect x="28" y="92" width="165" height="18" rx="3" fill="#B89138" />
  <text x="36" y="104" fill="#14283D" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">CATÁLOGO BIBLIOGRÁFICO PÚBLICO</text>

  <text x="28" y="136" fill="#FFFFFF" font-family="Georgia, serif" font-size="24" font-weight="bold">Encuentra tu próxima lectura</text>
  <text x="28" y="156" fill="#EAE5DA" font-family="system-ui, sans-serif" font-size="11">Explora nuestra colección literaria, científica e histórica con reserva en línea.</text>

  <!-- Search Input Mock -->
  <rect x="28" y="170" width="380" height="32" rx="4" fill="#FFFFFF" />
  <text x="42" y="190" fill="#6C757D" font-family="system-ui, sans-serif" font-size="11">Buscar por título, autor o ISBN...</text>
  <rect x="416" y="170" width="90" height="32" rx="4" fill="#1E6B43" />
  <text x="442" y="190" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Buscar</text>

  <!-- Hero Stats Box -->
  <rect x="545" y="96" width="225" height="106" rx="6" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" />
  <text x="565" y="132" fill="#D4B259" font-family="Georgia, serif" font-size="24" font-weight="bold">6</text>
  <text x="565" y="148" fill="#EAE5DA" font-family="system-ui, sans-serif" font-size="10">Títulos en catálogo</text>
  <line x1="655" y1="108" x2="655" y2="158" stroke="rgba(255,255,255,0.2)" />
  <text x="672" y="132" fill="#D4B259" font-family="Georgia, serif" font-size="24" font-weight="bold">25</text>
  <text x="672" y="148" fill="#EAE5DA" font-family="system-ui, sans-serif" font-size="10">Ejemplares disp.</text>
  <text x="565" y="182" fill="#EAE5DA" font-family="system-ui, sans-serif" font-size="9">Préstamo por 14 días • Renovable 2 veces</text>

