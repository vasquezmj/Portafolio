    <text x="73" y="53" fill="#FFFFFF" font-family="Georgia, serif" font-size="7" font-weight="bold">SAPIENS</text>
    <rect x="10" y="90" width="88" height="14" rx="3" fill="#234567" />
    <text x="15" y="100" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="8">Historia Universal</text>
    <text x="10" y="118" fill="#14283D" font-family="Georgia, serif" font-size="11" font-weight="bold">Sapiens: De animales</text>
    <text x="10" y="131" fill="#5A6570" font-family="system-ui, sans-serif" font-size="9">Yuval Noah Harari</text>
    <rect x="10" y="138" width="52" height="14" rx="3" fill="#E6F4EA" />
    <text x="16" y="148" fill="#1E6B43" font-family="system-ui, sans-serif" font-size="8" font-weight="bold">5 disp.</text>
    <rect x="108" y="136" width="56" height="16" rx="3" fill="#14283D" />
    <text x="118" y="147" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="8">Ver ficha</text>
